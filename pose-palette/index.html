const pairs=[

['会話する二人',[18,-1.45,0,48],[15,1.45,0,-48]],

function skeleton(p, pos, angle){

function ik(s,side,target){const a=s.arms[side], root=a[0], v=sub(target,root), dist=Math.min(1.05+.96-.025,Math.max(.13,norm(v))), d=unit(v), end=add(root,mul(d,dist));const along=(1.05**2-.96**2+dist**2)/(2*dist), bend=Math.sqrt(Math.max(0,1.05**2-along**2));let b=sub([0,-1,0],mul(d,dot([0,-1,0],d)));if(norm(b)<.1)b=sub(s.front,mul(d,dot(s.front,d)));a[1]=add(add(root,mul(d,along)),mul(unit(b),bend));a[2]=end;}

function project(p){return [origin[0]+dot(p,right)*scale,origin[1]-dot(p,up)*scale]}
function ell(c,ax,ay,az,rx,ry,rz,col){
 const n=mobile?8:14,m=mobile?12:22, verts=[];for(let i=0;i<=n;i++){const t=-Math.PI/2+i*Math.PI/n;const ring=[];for(let j=0;j<m;j++){const f=j*2*Math.PI/m;const v=[Math.cos(t)*Math.cos(f),Math.sin(t),Math.cos(t)*Math.sin(f)];const p=add(c,add(mul(ax,v[0]*rx),add(mul(ay,v[1]*ry),mul(az,v[2]*rz))));const normal=unit(add(mul(ax,v[0]/rx),add(mul(ay,v[1]/ry),mul(az,v[2]/rz))));ring.push([p,normal])}verts.push(ring)}
 for(let i=0;i<n;i++)for(let j=0;j<m;j++){const q=[verts[i][j],verts[i][(j+1)%m],verts[i+1][(j+1)%m],verts[i+1][j]], normal=unit(q.reduce((a,b)=>add(a,b[1]),[0,0,0]));if(dot(normal,cam)<=-.03)continue;const d=q.reduce((a,b)=>a+dot(b[0],cam),0)/4;const shade=.62+.36*Math.max(0,dot(normal,light))+.08*Math.max(0,dot(normal,cam));const color=col.map(x=>Math.min(255,Math.round(x*shade+8)));faces.push({q:q.map(v=>project(v[0])),d,color:`rgb(${color.join(',')})`})}

 ell(add(s.hips,mul(spine,.07)),...ax,.55,.38,.35,col);ell(add(s.hips,mul(spine,.65)),...ax,.40,.67,.30,col);ell(add(s.hips,mul(spine,1.20)),...ax,.65,.62,.38,col);

}
let frame=0;function draw(){if(!frame)frame=requestAnimationFrame(()=>{frame=0;render()})}function render(){if(!people.length||!W||!H)return;const yaw=(+$('yaw').value)*(flip?-1:1)*R,pitch=+$('pitch').value*R;cam=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)];right=[Math.cos(yaw),0,-Math.sin(yaw)];up=cross(cam,right);if(flip)right=mul(right,-1);light=unit(add(add(mul(right,-.5),mul(up,.9)),mul(cam,.7)));$('yv').textContent=$('yaw').value+'°';$('pv').textContent=$('pitch').value+'°';

}
function resize(){const b=cv.getBoundingClientRect(),d=Math.min(mobile?1.5:3,window.devicePixelRatio||1);const w=Math.round(b.width),h=Math.round(b.height);if(w<1||h<1)return;if(W===w&&H===h&&cv.width===Math.round(w*d)&&cv.height===Math.round(h*d)){draw();return}W=w;H=h;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);draw()}
